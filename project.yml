# 用 XcodeGen 生成 Xcode 工程：brew install xcodegen && xcodegen generate
name: StyleCam
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "27.0"
targets:
  StyleCam:
    type: application
    platform: iOS
    sources:
      - path: StyleCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.stylecam   # 改成你自己的
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""                              # 填你的 Team ID，或在 Xcode 里选
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 同款相机
        INFOPLIST_KEY_NSCameraUsageDescription: 需要使用相机来拍摄与参考图同款风格的照片
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 需要把拍好的照片保存到相册
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 需要读取你选择的参考图
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 录制同款风格视频时需要收录声音
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarHidden: YES
  StyleCamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StyleCamTests
    dependencies:
      - target: StyleCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.stylecam.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  StyleCam:
    build:
      targets:
        StyleCam: all
        StyleCamTests: [test]
    test:
      targets:
        - StyleCamTests
