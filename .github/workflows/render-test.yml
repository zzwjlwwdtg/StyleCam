# 在 iPhone 模拟器里用 App 同一套代码渲染测试图，结果推到 render-test 分支
name: Render Test

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: 生成工程
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 选择模拟器
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          best=None
          for rt,devs in d.items():
              if "iOS" not in rt: continue
              for x in devs:
                  if x["name"].startswith("iPhone"):
                      best=(rt,x["udid"],x["name"])
          print(best[1] if best else "")')
          echo "udid=$UDID" >> $GITHUB_OUTPUT
          xcrun simctl list devices available | grep -i iphone | tail -5

      - name: 下载人脸样图（Wikimedia Commons，自由许可）
        run: |
          mkdir -p "$RUNNER_TEMP/faces"
          cd "$RUNNER_TEMP/faces"
          UA="StyleCam-render-test/1.0 (https://github.com/zzwjlwwdtg/StyleCam)"
          for f in "Acne_vulgaris_on_a_very_oily_skin.jpg" "AcneVulgarisUSMIL.jpg" "Acne_vulgaris_1.jpg" \
                   "Rosacea_01.jpg" "Man_portrait_(5618755358).jpg" "Ageing_of_the_human_face.jpg" \
                   "Elderly_Woman,_B%26W_image_by_Chalmers_Butterfield.jpg"; do
            n="${f//%26/and}"; n="${n//,/}"
            curl -sSfL -A "$UA" -o "$n" "https://commons.wikimedia.org/wiki/Special:FilePath/${f}?width=2400" \
              && echo "ok  $n $(stat -f%z "$n")" || { echo "跳过 $f"; rm -f "$n"; }
          done
          ls -la

      - name: 运行渲染测试
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -o pipefail
          mkdir -p out
          ONLY=""
          # 提交信息带 [ui-only] 时只跑界面截图，几分钟出结果
          case "$COMMIT_MSG" in *"[ui-only]"*) ONLY="-only-testing:StyleCamTests/FilmCabinetSnapshotTests" ;; esac
          case "$COMMIT_MSG" in *"[beauty-only]"*) ONLY="-only-testing:StyleCamTests/BeautyTests" ;; esac
          case "$COMMIT_MSG" in *"[retouch-only]"*) ONLY="-only-testing:StyleCamTests/RetouchTests" ;; esac
          case "$COMMIT_MSG" in *"[faces-only]"*) ONLY="-only-testing:StyleCamTests/FaceSampleTests" ;; esac
          TEST_RUNNER_FACE_SAMPLES_DIR="$RUNNER_TEMP/faces" TEST_RUNNER_OUTPUT_DIR="$PWD/out" xcodebuild test $ONLY \
            -project StyleCam.xcodeproj -scheme StyleCam \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error:|Test Case|passed|failed|TEST " || true
          cp test.log out/ || true
          grep -E "error:" test.log | head -50 > out/errors.txt || true

      - name: 推送结果到 render-test 分支
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p /tmp/rt && cp -R out/. /tmp/rt/
          git checkout -q --orphan render-test
          git rm -rfq --cached .
          git clean -fdq
          cp -R /tmp/rt/. .
          git add -f .
          git commit -qm "render test for ${GITHUB_SHA::7}"
          git push -qf origin render-test
