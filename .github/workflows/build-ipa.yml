# 在 GitHub 的云端 Mac（Xcode 27）上编译，产出未签名的 StyleCam.ipa。
# 下载后在 Windows 上用 Sideloadly + 你的 Apple ID 签名安装到 iPhone。
name: Build IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen 并生成工程
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild -project StyleCam.xcodeproj -target StyleCam \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Release-iphoneos/StyleCam.app

      - name: 打包 IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/StyleCam.app Payload/
          zip -qr StyleCam.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: StyleCam-ipa
          path: StyleCam.ipa

      - name: 同时把 IPA 放到 ipa-build 分支（方便用 git 直接取回）
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan ipa-build
          git rm -rfq --cached .
          git add -f StyleCam.ipa
          git commit -qm "IPA from ${GITHUB_SHA::7}"
          git push -qf origin ipa-build

      - name: 上传编译日志（失败时排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
